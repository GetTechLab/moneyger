name: Moneyger
options:
  bundleIdPrefix: com.moneyger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

targets:
  Moneyger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Moneyger
    resources:
      - path: Moneyger/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyger.app
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Moneyger/Resources/Info.plist
        DEVELOPMENT_TEAM: 673GW6BN2P
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Moneyger/Resources/Moneyger.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.moneyger.app
    dependencies:
      - package: GoogleSignIn
      - target: MoneygerShare
        embed: true
    info:
      path: Moneyger/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.720077517069-fmbatfv2ui58av0s98qh3qud1gat10dm
        CFBundleDocumentTypes:
          - CFBundleTypeName: Statement
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.image
        LSSupportsOpeningDocumentsInPlace: false
        LSApplicationQueriesSchemes:
          - googlegmail
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  MoneygerShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MoneygerShare
      - Moneyger/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyger.app.share
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: MoneygerShare/Info.plist
        DEVELOPMENT_TEAM: 673GW6BN2P
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: MoneygerShare/MoneygerShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.moneyger.app
    info:
      path: MoneygerShare/Info.plist
      properties:
        CFBundleDisplayName: Moneyger
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 5

  MoneygerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MoneygerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneyger.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: Moneyger

schemes:
  Moneyger:
    build:
      targets:
        Moneyger: all
        MoneygerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoneygerUITests
    archive:
      config: Release
